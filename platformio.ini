; SD PRO custom firmware - clock + crypto ticker with chart
; Pins come in two flavours, pick the env that lights the panel up.

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.ldscript = ld/eagle.flash.4m1m-big.ld
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
; re-apply the SDPRO framework patches (heap rescue arena + BearSSL 6s
; timeout) before each build - they live in tools/framework-patches
extra_scripts = pre:tools/apply_framework_patches.py

; exact versions of the tested 2026-10-07 build, so a rebuild on any machine
; produces the same firmware
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    bodmer/TJpg_Decoder@1.1.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    ; font8 and GFXFF (loadFont smooth fonts) have zero call sites in the
    ; firmware - dropped to keep the library lean; font_ru.h brings its own
    ; gfxfont.h include for the manual Cyrillic renderer
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; SmallTV / SD PRO backlight is P-MOSFET on GPIO5: LOW = on
    -D TFT_BACKLIGHT_ON=LOW
    -D CORE_DEBUG_LEVEL=1
    ; NB: do NOT add -fexceptions here: it rebuilds the core, which disables
    ; abi.cpp's malloc-based operator new, and unwinding through -fno-exceptions
    ; core frames fails -> direct abort() ("Abort called") instead of a catch.
    ; httpGetStart pre-checks the heap instead so its new() never fails.

; smalltv-mod pinout (giovi321/smalltv-mod hardware page)
[env:sdpro]
build_flags =
    ${env.build_flags}
    -D TFT_CS=15
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_BL=5

; mdreal SD PRO pinout (alternate board revision)
[env:sdpro_alt]
build_flags =
    ${env.build_flags}
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=5
