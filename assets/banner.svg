<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b6"/>
      <stop offset="1" stop-color="#6cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2bb67355"/>
      <stop offset="1" stop-color="#2bb67300"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="90" y="40" width="1100" height="280" rx="24" fill="url(#glow)"/>
  <!-- CRT TV body -->
  <g transform="translate(150,78)">
    <rect x="0" y="0" width="204" height="204" rx="18" fill="#1a2130" stroke="#2a3342" stroke-width="3"/>
    <rect x="16" y="16" width="172" height="172" rx="10" fill="#050a08"/>
    <!-- clock face -->
    <text x="102" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#7fa" font-family="Consolas, monospace">20:47</text>
    <!-- candlestick chart -->
    <g stroke="#2b6" stroke-width="5" stroke-linecap="round">
      <line x1="40" y1="150" x2="40" y2="168"/><line x1="70" y1="140" x2="70" y2="164"/>
      <line x1="100" y1="116" x2="100" y2="146" stroke="#6cf"/><line x1="130" y1="96" x2="130" y2="130"/>
      <line x1="160" y1="74" x2="160" y2="112"/>
    </g>
    <line x1="24" y1="152" x2="180" y2="152" stroke="#2a3342" stroke-width="2"/>
  </g>
  <text x="420" y="158" font-size="60" font-weight="800" fill="#e8f5ee">RetroTV Pro</text>
  <text x="420" y="208" font-size="26" fill="#9ab">ESP8266 crypto clock firmware for SmallTV / SD PRO</text>
  <rect x="420" y="232" width="820" height="4" rx="2" fill="url(#acc)"/>
  <text x="420" y="278" font-size="20" fill="#678">ST7789 240x240 &#183; PlatformIO &#183; OTA &#183; 4-language web UI &#183; MIT</text>
</svg>
